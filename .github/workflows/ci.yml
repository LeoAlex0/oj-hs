name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, lint, and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # 将 flake 的 devShell 输入也推送到 cache
          pushFilter: "source-root"

      - name: Run CI checks
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail

          echo "::group::Toolchain"
            ghc --version
            cabal --version
            stylish-haskell --version
            hlint --version
          echo "::endgroup::"

          echo "::group::Cabal package index"
          cabal update
          echo "::endgroup::"

          echo "::group::Haskell formatting"
          failed=0
          while IFS= read -r file; do
            formatted="$(mktemp)"
            stylish-haskell "$file" > "$formatted"
            if ! diff -u "$file" "$formatted"; then
              failed=1
            fi
            rm -f "$formatted"
          done < <(git ls-files "*.hs")

          echo "::endgroup::"
          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi

          echo "::group::HLint"
          mapfile -t files < <(git ls-files "*.hs")
          hlint "${files[@]}"
          echo "::endgroup::"

          echo "::group::Build all targets"
          cabal build all
          echo "::endgroup::"

          echo "::group::Unit tests"
          cabal test all --test-show-details=direct
          echo "::endgroup::"
          EOF
