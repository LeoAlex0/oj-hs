name: CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - ".stylish-haskell.yaml"
      - "app/**"
      - "bench/**"
      - "flake.lock"
      - "flake.nix"
      - "oj-hs.cabal"
      - "package.yaml"
      - "shell.nix"
      - "src/**"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".stylish-haskell.yaml"
      - "app/**"
      - "bench/**"
      - "flake.lock"
      - "flake.nix"
      - "oj-hs.cabal"
      - "package.yaml"
      - "shell.nix"
      - "src/**"
      - "test/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, lint, and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run CI checks
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail

          echo "::group::Toolchain"
            ghc --version
            cabal --version
            stylish-haskell --version
            hlint --version
          echo "::endgroup::"

          echo "::group::Haskell formatting"
          failed=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            formatted="$(mktemp)"
            stylish-haskell "$file" > "$formatted"
            if ! diff -u "$file" "$formatted"; then
              failed=1
            fi
            rm -f "$formatted"
          done < <(git ls-files "*.hs")

          echo "::endgroup::"
          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi

          echo "::group::HLint"
          mapfile -t files < <(git ls-files "*.hs" | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done)
          hlint "${files[@]}"
          echo "::endgroup::"

          echo "::group::Build executables"
          cabal build --offline exe:bundler exe:codeforces-wip exe:luogu-wip
          echo "::endgroup::"
          EOF
