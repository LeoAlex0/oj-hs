name: Benchmark

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Generate benchmark report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run benchmarks
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail

          echo "::group::Toolchain"
          ghc --version
          cabal --version
          echo "::endgroup::"

          echo "::group::Cabal package index"
          cabal update
          echo "::endgroup::"

          echo "::group::Benchmarks"
          cabal bench --builddir=dist-benchmark benchmark-prac-haskell-bench --benchmark-options='--csv bench.csv --timeout 20 --stdev 100'
          echo "::endgroup::"
          EOF
          awk 'BEGIN { FS = OFS = "," } NR == 1 { print; next } $1 !~ /^All[.]/ { $1 = "All." $1 } { print }' bench.csv > bench.normalized.csv
          mv bench.normalized.csv bench.csv

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            bench.csv
          if-no-files-found: error
