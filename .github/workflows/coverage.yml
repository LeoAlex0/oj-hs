name: Coverage

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Generate coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run tests and collect coverage
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail
          cabal update
          cabal test --builddir=dist-coverage --enable-coverage --test-show-details=direct oj-hs-test

          # 合并所有生成的 .tix 文件
          tix_files=$(find dist-coverage -name '*.tix' -print)
          if [ -z "$tix_files" ]; then
            echo "No .tix files generated" >&2
            exit 1
          fi
          hpc combine $tix_files --output=coverage.tix

          # 直接定位 mix 目录（通常只有一个包，深度匹配即可）
          mix_dir=$(find dist-coverage -type d -name mix -print -quit)
          if [ -z "$mix_dir" ]; then
            echo "Could not find mix directory" >&2
            exit 1
          fi

          mkdir -p artifacts/coverage
          hpc report coverage.tix --hpcdir="$mix_dir" | tee artifacts/coverage/coverage.txt
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error
