name: Coverage

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Generate coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # 将 flake 的 devShell 输入也推送到 cache
          pushFilter: "source-root"

      - name: Run tests and collect coverage
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail

          echo "::group::Toolchain"
          ghc --version
          cabal --version
          hpc version
          echo "::endgroup::"

          echo "::group::Cabal package index"
          cabal update
          echo "::endgroup::"

          echo "::group::Coverage tests"
          cabal test --builddir=dist-coverage --enable-coverage --test-show-details=direct oj-hs-test
          echo "::endgroup::"

          echo "::group::Coverage report"
          mkdir -p artifacts/coverage

          package_tix="$(find dist-coverage -path "*/hpc/vanilla/tix/*/*.tix" ! -path "*/oj-hs-test/*" -print -quit)"
          if [ -z "$package_tix" ]; then
            echo "Could not find package coverage .tix file" >&2
            exit 1
          fi

          package_id="$(basename "$(dirname "$package_tix")")"
          mix_dir="$(find dist-coverage -path "*/hpc/vanilla/mix/$package_id" -type d -print -quit)"
          if [ -z "$mix_dir" ]; then
            echo "Could not find package coverage .mix directory for $package_id" >&2
            exit 1
          fi

          hpc report "$package_tix" --hpcdir="$mix_dir" | tee artifacts/coverage/coverage.txt

          html_dir="$(find dist-coverage -path "*/hpc/vanilla/html" -type d -print -quit)"
          if [ -n "$html_dir" ]; then
            cp -R "$html_dir" artifacts/coverage/html
          fi
          echo "::endgroup::"
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error
