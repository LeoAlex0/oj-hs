name: Coverage

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/coverage.yml"
      - "flake.lock"
      - "flake.nix"
      - "oj-hs.cabal"
      - "package.yaml"
      - "shell.nix"
      - "src/**"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/coverage.yml"
      - "flake.lock"
      - "flake.nix"
      - "oj-hs.cabal"
      - "package.yaml"
      - "shell.nix"
      - "src/**"
      - "test/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Test and generate coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: oj-hs # 你的 cache 名称
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run tests and collect coverage
        run: |
          nix develop --ignore-environment .#ci --command bash -s <<'EOF'
          set -euo pipefail
          cabal update
          cabal test --builddir=dist-coverage --enable-coverage --test-show-details=direct oj-hs-test

          # 收集所有 .tix 文件
          mapfile -t tix_files < <(find dist-coverage -name '*.tix' -print)
          if [ ${#tix_files[@]} -eq 0 ]; then
            echo "No .tix files generated" >&2
            exit 1
          fi

          # 逐个合并
          cp "${tix_files[0]}" combined.tix
          for f in "${tix_files[@]:1}"; do
            hpc combine combined.tix "$f" --output=tmp.tix
            mv tmp.tix combined.tix
          done

          # Cabal splits library and test .mix files; hpc needs both roots.
          mapfile -t mix_dirs < <(
            find dist-coverage -type d \
              \( -path "*/build/extra-compilation-artifacts/hpc/vanilla/mix" \
              -o -path "*/t/oj-hs-test/build/oj-hs-test/oj-hs-test-tmp/extra-compilation-artifacts/hpc/vanilla/mix" \) \
              -print
          )
          if [ ${#mix_dirs[@]} -eq 0 ]; then
            echo "Could not find mix directory" >&2
            exit 1
          fi

          hpc_args=()
          for dir in "${mix_dirs[@]}"; do
            hpc_args+=(--hpcdir="$dir")
          done

          mkdir -p artifacts/coverage
          hpc report combined.tix "${hpc_args[@]}" | tee artifacts/coverage/coverage.txt
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error
