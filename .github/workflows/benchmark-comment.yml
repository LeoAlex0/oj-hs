name: Benchmark Comment

on:
  workflow_run:
    workflows:
      - Benchmark
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment benchmark result on PR
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          nix develop --ignore-environment .#ci-tools --command env \
            GH_TOKEN="$GH_TOKEN" \
            gh run download "$TRIGGERING_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name benchmark-report \
            --dir artifacts/benchmark-current

      - name: Comment benchmark result
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          nix develop --ignore-environment .#ci-tools --command env \
            GH_TOKEN="$GH_TOKEN" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            TRIGGERING_RUN_ID="$TRIGGERING_RUN_ID" \
            bash -s <<'EOF'
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          base_ref="$(jq -r '.workflow_run.pull_requests[0].base.ref // empty' "$GITHUB_EVENT_PATH")"
          current_ref="$(jq -r '.workflow_run.pull_requests[0].head.ref // .workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")"
          pr_head_repo="$(jq -r '.workflow_run.head_repository.full_name // empty' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"

          if [ -z "$pr_number" ]; then
            echo "No pull request was attached to workflow run $TRIGGERING_RUN_ID; skipping comment."
            exit 0
          fi

          env \
            BASE_REF="$base_ref" \
            BENCHMARK_BASE_DIR="artifacts/benchmark-base" \
            BENCHMARK_CURRENT_CSV="artifacts/benchmark-current/bench.csv" \
            BENCHMARK_SUMMARY="benchmark-summary.md" \
            CURRENT_REF="$current_ref" \
            GH_TOKEN="$GH_TOKEN" \
            GITHUB_REPOSITORY="${{ github.repository }}" \
            GITHUB_RUN_ID="$TRIGGERING_RUN_ID" \
            GITHUB_SERVER_URL="${{ github.server_url }}" \
            GITHUB_SHA="$head_sha" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            PR_HEAD_REPO="$pr_head_repo" \
            PR_NUMBER="$pr_number" \
            .github/scripts/benchmark-pr-comment.sh
          EOF
