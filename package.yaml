name: oj-hs
version: 0.1.0.0
github: "LeoAlex0/oj-hs"
license: BSD-3-Clause
author: "zLeoAlex"
maintainer: "z.alex.leo@outlook.com"
copyright: "zLeoAlex"

extra-source-files:
  - README.md
  - app/bundler/README.md
  - ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/LeoAlex0/oj-hs#readme>

dependencies:
  - base >= 4.7 && < 5
  - Cabal >=3 && < 4
  - containers
  - directory
  - mtl
  - parsec
  - parser-combinators
  - deepseq
  - array
  - containers
  - vector
  - text
  - bytestring
  - filepath
  - ghc
  - hashable
  - optparse-applicative
  - process
  - time
  - unordered-containers

library:
  source-dirs: src
  ghc-options:
    - -O2

executables:
  luogu-wip:
    main: Main.hs
    source-dirs: app/luogu-wip
    dependencies:
      - oj-hs
  codeforces-wip:
    main: Main.hs
    source-dirs: app/codeforces-wip
    dependencies:
      - oj-hs
  bundler:
    main: Main.hs
    source-dirs: app/bundler
    dependencies:
      - oj-hs

tests:
  oj-hs-test:
    main: Spec.hs
    source-dirs: test
    build-tools:
      - hspec-discover
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - oj-hs
      - QuickCheck
      - hspec
      - hspec-contrib
      - QuickCheck
      - HUnit

benchmarks:
  benchmark-prac-haskell-bench:
    source-dirs: bench
    main: BenchDiscover.hs
    build-tools:
      - tasty-discover
    ghc-options:
      - -O2
    dependencies:
      - oj-hs
      - tasty
      - tasty-bench
      - random
      - deepseq
